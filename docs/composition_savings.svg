<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Advanced composition epsilon savings vs repeated query count</title>
  <desc id="desc">Line chart showing negative savings at k equals 10, then increasing savings through k equals 500 for per-query epsilon 0.1.</desc>
  <rect width="760" height="360" fill="#0b0d14"/>
  <text x="42" y="38" fill="#d8dce8" font-family="IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="600">Advanced composition savings trend</text>
  <text x="42" y="61" fill="#7d849d" font-family="Inter, Arial, sans-serif" font-size="13">Per-query epsilon = 0.1, delta = 1e-5, delta' = 1e-5</text>

  <g transform="translate(74 84)">
    <line x1="0" y1="220" x2="620" y2="220" stroke="#343b55" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#343b55" stroke-width="1"/>
    <line x1="0" y1="111.1" x2="620" y2="111.1" stroke="#252a3d" stroke-width="1" stroke-dasharray="4 5"/>
    <text x="-42" y="224" fill="#7d849d" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">-80%</text>
    <text x="-36" y="115" fill="#7d849d" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">0%</text>
    <text x="-42" y="5" fill="#7d849d" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">80%</text>

    <polyline fill="none" stroke="#5fd0c0" stroke-width="3" points="0,194.9 124,119.3 248,80.7 372,52.8 496,28.2 620,16"/>
    <g fill="#5fd0c0" stroke="#0b0d14" stroke-width="2">
      <circle cx="0" cy="194.9" r="5"/>
      <circle cx="124" cy="119.3" r="5"/>
      <circle cx="248" cy="80.7" r="5"/>
      <circle cx="372" cy="52.8" r="5"/>
      <circle cx="496" cy="28.2" r="5"/>
      <circle cx="620" cy="16" r="5"/>
    </g>

    <g fill="#7d849d" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">
      <text x="-7" y="245">10</text>
      <text x="112" y="245">25</text>
      <text x="236" y="245">50</text>
      <text x="357" y="245">100</text>
      <text x="481" y="245">250</text>
      <text x="605" y="245">500</text>
      <text x="270" y="276">repeated queries (k)</text>
    </g>

    <g fill="#d8dce8" font-family="IBM Plex Mono, Consolas, monospace" font-size="11">
      <text x="8" y="187">-61.7%</text>
      <text x="132" y="112">-6.0%</text>
      <text x="256" y="73">22.1%</text>
      <text x="380" y="45">42.0%</text>
      <text x="504" y="21">59.7%</text>
      <text x="565" y="9">68.5%</text>
    </g>
  </g>
</svg>
